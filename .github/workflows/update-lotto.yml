name: Update Lotto Data

# 매주 토요일 추첨(20:35 KST 전후) 직후 최신 회차를 자동 반영한다.
# 변경이 있으면 github-actions[bot] 이 main 에 커밋/푸시 → Cloudflare Pages 자동 배포.
on:
  schedule:
    # GitHub cron 은 UTC 기준 (KST = UTC+9)
    - cron: '0 12 * * 6'   # 토요일 21:00 KST
    - cron: '0 13 * * 6'   # 토요일 22:00 KST (재시도)
    - cron: '0 1 * * 0'    # 일요일 10:00 KST (발표 지연 대비 최종 보정)
  workflow_dispatch:       # 수동 실행

permissions:
  contents: write

# 동시 실행 시 push 충돌 방지
concurrency:
  group: update-lotto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch & validate new draws
        id: update
        run: node tools/update-lotto.js

      - name: Sanity check data file
        if: steps.update.outputs.updated == 'true'
        run: |
          node -e "
            global.window = {};
            require('vm').runInNewContext(require('fs').readFileSync('data/lotto_history.js','utf8'), global);
            const d = window.LOTTO_HISTORY;
            if (!Array.isArray(d) || d.length !== d[d.length-1].no) { throw new Error('회차 수/최신 회차 불일치'); }
            console.log('OK:', d.length, '회차, 최신', d[d.length-1].no, d[d.length-1].date);
          "

      - name: Commit & push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto_history.js index.html
          git commit -m "chore: 로또 제${{ steps.update.outputs.latest }}회 당첨 데이터 자동 갱신 (${{ steps.update.outputs.added }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "### 로또 데이터 자동 갱신" >> "$GITHUB_STEP_SUMMARY"
          echo "- 최신 회차: ${{ steps.update.outputs.latest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 신규 반영: ${{ steps.update.outputs.updated == 'true' && steps.update.outputs.added || '없음' }}" >> "$GITHUB_STEP_SUMMARY"
