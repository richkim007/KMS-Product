<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Astro-Rhythm Lotto</title>
    <link rel="stylesheet" href="style.css?v=12.0"> <!-- version up -->
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quantum Astro-Rhythm Lotto</h1>
            <p>양자역학, 별자리, 그리고 당신의 바이오리듬을 이용한 번호 생성</p>
        </div>
        <div class="user-inputs">
            <div class="input-group">
                <label for="birthdate">생년월일</label>
                <input type="date" id="birthdate">
            </div>
            <div class="input-group">
                <label for="zodiac">별자리</label>
                <select id="zodiac">
                    <option value="">별자리를 선택하세요</option>
                    <option value="aries">양자리</option>
                    <option value="taurus">황소자리</option>
                    <option value="gemini">쌍둥이자리</option>
                    <option value="cancer">게자리</option>
                    <option value="leo">사자자리</option>
                    <option value="virgo">처녀자리</option>
                    <option value="libra">천칭자리</option>
                    <option value="scorpio">전갈자리</option>
                    <option value="sagittarius">사수자리</option>
                    <option value="capricorn">염소자리</option>
                    <option value="aquarius">물병자리</option>
                    <option value="pisces">물고기자리</option>
                </select>
            </div>
        </div>

        <div class="lotto-display">
        </div>

        <button id="generate-btn">번호 생성</button>
    </div>
    <script src="main.js?v=12.0"></script> <!-- version up -->
</body>
</html>
