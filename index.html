<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Astro-Rhythm Lotto</title>
    <link rel="stylesheet" href="style.css?v=11.0">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quantum Astro-Rhythm Lotto</h1>
            <p>양자역학에 의해 생년월일과 태어난 시간을 입력하면 당신만의 행운의 로또번호 숫자가 생성됩니다</p>
        </div>
        <div class="user-inputs">
            <div class="input-group">
                <label for="birthdate">생년월일</label>
                <input type="date" id="birthdate">
            </div>
            <div class="input-group">
                <label for="birthtime">태어난 시간</label>
                <input type="time" id="birthtime">
            </div>
        </div>
        <div class="zodiac-display">
            <strong>별자리:</strong> <span id="zodiac-sign">생년월일을 입력하세요</span>
        </div>
        <button id="generate-btn">번호 생성</button>
        <div class="lotto-display">
            <!-- Lotto numbers will be displayed here -->
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
