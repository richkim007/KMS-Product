<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>사이트 공사중</title>
  <meta name="description" content="사이트 공사중입니다.">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 30% 20%, #1e293b, #0b1020 70%);
      color: #e2e8f0; font-family: "Noto Sans KR", system-ui, sans-serif; text-align: center;
    }
    .icon { font-size: 72px; animation: bob 2s ease-in-out infinite; }
    h1 { font-size: 2.4rem; margin: 16px 0 8px; }
    p { color: #94a3b8; margin: 0; }
    @keyframes bob { 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <main>
    <div class="icon">🚧</div>
    <h1>사이트 공사중</h1>
    <p>더 나은 서비스로 찾아뵙겠습니다.</p>
  </main>
</body>
</html>
