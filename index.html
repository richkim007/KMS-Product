<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMS 로또 랩 - 서비스 점검 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div
        class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
        <div class="relative z-10 space-y-6">
            <div
                class="w-20 h-20 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-inner">
                <i class="fa-solid fa-screwdriver-wrench animate-bounce"></i>
            </div>
            <div class="space-y-2">
                <span
                    class="inline-block px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-bold rounded-full">
                    시스템 점검 및 고도화 진행 중
                </span>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">
                    사이트 공사 중입니다
                </h1>
                <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">
                    더 나은 데이터 분석 엔진과 안정적인 서비스 제공을 위해 사이트 개편 작업을 진행하고 있습니다.
                </p>
            </div>
            <div
                class="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 text-left text-xs space-y-2 text-slate-300">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                    <span class="text-slate-500">서비스명</span>
                    <span class="font-bold text-white">KMS 로또 빅데이터 랩</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500">작업 상태</span>
                    <span class="text-amber-400 font-semibold">비공개 내부 검수 중</span>
                </div>
            </div>
            <p class="text-[11px] text-slate-600">
                © 2026 KMS Lab. 작업 완료 시 정상 공개될 예정입니다.
            </p>
        </div>
    </div>
</body>

</html>
