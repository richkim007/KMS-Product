<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Astro-Rhythm Lotto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quantum Astro-Rhythm Lotto</h1>
        <p class="subtitle">양자역학, 별자리, 그리고 당신의 바이오리듬을 이용한 번호 생성</p>

        <div class="user-inputs">
            <div class="input-group">
                <label for="birthdate">생년월일</label>
                <input type="date" id="birthdate">
            </div>
            <div class="input-group">
                <label for="zodiac">별자리</label>
                <select id="zodiac" disabled>
                    <option value="" disabled selected>별자리를 선택하세요</option>
                    <option value="aquarius">물병자리 (1/20~2/18)</option>
                    <option value="pisces">물고기자리 (2/19~3/20)</option>
                    <option value="aries">양자리 (3/21~4/19)</option>
                    <option value="taurus">황소자리 (4/20~5/20)</option>
                    <option value="gemini">쌍둥이자리 (5/21~6/21)</option>
                    <option value="cancer">게자리 (6/22~7/22)</option>
                    <option value="leo">사자자리 (7/23~8/22)</option>
                    <option value="virgo">처녀자리 (8/23~9/23)</option>
                    <option value="libra">천칭자리 (9/24~10/22)</option>
                    <option value="scorpio">전갈자리 (10/23~11/22)</option>
                    <option value="sagittarius">사수자리 (11/23~12/24)</option>
                    <option value="capricorn">염소자리 (12/25~1/19)</option>
                </select>
            </div>
        </div>

        <div class="lotto-display">
            <!-- 5 sets of numbers will be generated here -->
        </div>

        <button id="generate-btn">번호 생성</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
